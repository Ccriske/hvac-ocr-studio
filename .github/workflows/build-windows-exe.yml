name: Build & Publish Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'site/index.html'
      - 'hvac_ocr_desktop.py'
      - 'hvac_pdf_ocr.py'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract OCR
        shell: pwsh
        run: choco install tesseract -y

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pypdf pypdfium2 pytesseract pillow reportlab pywebview

      - name: Build unified Windows desktop app (bundles site/index.html, pywebview & Tesseract)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "HVAC_OCR_Studio" `
            --collect-all webview `
            --collect-all pypdfium2 `
            --hidden-import webview.platforms.edgechromium `
            --add-data "site;site" `
            --add-data "C:\Program Files\Tesseract-OCR;tesseract" `
            hvac_ocr_desktop.py

      - name: Package portable folder into zip
        shell: pwsh
        run: Compress-Archive -Path "dist\HVAC_OCR_Studio" -DestinationPath "HVAC_OCR_Studio_Windows.zip" -Force

      - name: Publish to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HVAC OCR Studio (Windows Desktop)
          body: |
            Native Windows desktop app using the exact same UI as the web app, powered by lossless vector-preserving OCR and native PDF Bookmarks.

            **How to use:**
            1. Download `HVAC_OCR_Studio_Windows.zip` below.
            2. Right-click -> **Extract All**.
            3. Open `HVAC_OCR_Studio` and run `HVAC_OCR_Studio.exe`.
          files: HVAC_OCR_Studio_Windows.zip
          make_latest: true
