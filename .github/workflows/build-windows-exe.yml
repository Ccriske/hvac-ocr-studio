name: Build & Publish Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'hvac_ocr_desktop.py'
      - 'hvac_pdf_ocr.py'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract OCR
        shell: pwsh
        run: choco install tesseract -y

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pypdf pypdfium2 pytesseract pillow

      - name: Build portable Windows app (--onedir for IT/AV compatibility)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "HVAC_Plan_OCR" `
            --add-data "C:\Program Files\Tesseract-OCR;tesseract" `
            hvac_ocr_desktop.py

      - name: Package portable folder into zip
        shell: pwsh
        run: Compress-Archive -Path "dist\HVAC_Plan_OCR" -DestinationPath "HVAC_OCR_Studio_Windows.zip" -Force

      - name: Publish to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HVAC OCR Studio (Windows Portable)
          body: |
            Portable Windows desktop app for fast, multi-core OCR on large HVAC plan & spec sets.

            **How to use:**
            1. Download `HVAC_OCR_Studio_Windows.zip` below.
            2. Right-click -> **Extract All**.
            3. Open the extracted `HVAC_Plan_OCR` folder and run `HVAC_Plan_OCR.exe` (Python and Tesseract are already bundled).
          files: HVAC_OCR_Studio_Windows.zip
          make_latest: true
